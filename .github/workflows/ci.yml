name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The shared selection fixtures, and the Blazor component rendered with HtmlRenderer.
      - run: dotnet test Brua.Web.Tests
